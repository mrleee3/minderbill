name: Build app from source

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build-main
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Publish artifact
        run: |
          cp dist/app.html index.html
          printf '{"build":"%s","time":"%s"}\n' "${GITHUB_SHA::7}" "$(date -u +%FT%TZ)" > version.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html version.json
          git diff --cached --quiet || git commit -m "build: ${GITHUB_SHA::7}"
          git push
